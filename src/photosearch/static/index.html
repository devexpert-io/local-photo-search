<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tus fotos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p class="kicker"><span class="dot"></span>EmbeddingGemma 2 · 100% local</p>
    <h1>Tus fotos</h1>
    <form id="search" autocomplete="off">
      <div id="chip" hidden>
        <img alt="">
        <span>Parecidas a esta</span>
        <button type="button" aria-label="Quitar">×</button>
      </div>
      <input id="query" type="search" autofocus
             placeholder="Busca lo que quieras: «un perro», «algo para cenar»… o arrastra una foto">
    </form>
    <div class="meta">
      <span id="status"></span>
      <label class="toggle"><input id="scores" type="checkbox"> Puntuaciones</label>
    </div>
  </header>

  <main id="grid"></main>

  <dialog id="viewer">
    <img id="viewer-img" alt="">
    <div class="viewer-bar">
      <span id="viewer-date"></span>
      <button id="more" class="pill">Más como esta</button>
      <button id="close" class="ghost">Cerrar</button>
    </div>
  </dialog>

  <div id="drop">Suelta la foto para buscar parecidas</div>

  <script src="app.js"></script>
</body>
</html>
